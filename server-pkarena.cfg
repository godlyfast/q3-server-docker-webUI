//  RCON / Admin    //
//////////////////////
set rconPassword                  "__RCON_PASSWORD__"
set sv_privateClients             "0"

//////////////////////
//  Network         //
//////////////////////
set sv_maxRate                    "0"
set sv_maxPing                    "0"
