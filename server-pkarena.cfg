//////////////////////
// Gameplay Options //
//////////////////////
set g_gametype                    "0"
set fraglimit                     "30"
set timelimit                     "15"
set capturelimit                  "8"
set g_forceRespawn                "10"
set g_warmup                      "15"
set g_dowarmup                    "0"
set g_teamautojoin                "0"
