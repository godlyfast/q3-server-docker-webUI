/////////////////////////////////////////////
//     CENDAS Q3 Server Configuration     //
/////////////////////////////////////////////

//////////////////////
// Gameplay Options //
//////////////////////
set g_gametype                 "0"
set fraglimit                  "30"
set timelimit                  "15"
set capturelimit               "8"
set g_forceRespawn             "10"
set g_warmup                   "15"
set g_dowarmup                 "0"
set g_teamautojoin             "0"
set g_teamforcebalance         "1"

//////////////////////
//  Server Options  //
//////////////////////
set sv_hostname                "CENDAS Q3 Server"
set sv_maxclients              "16"
set sv_pure                    "0"
set sv_allowDownload           "1"
set sv_cheats                  "0"
set sv_floodprotect            "1"
set g_inactivity               "120"
set g_motd                     "Welcome to CENDAS Q3"
set g_needpass                 "0"
set g_gravity                  "800"
set g_speed                    "320"
set g_knockback                "1000"

//////////////////////
//  RCON / Admin    //
//////////////////////
set rconPassword               "CHANGEME"
set sv_privateClients          "0"

//////////////////////
//  Network         //
//////////////////////
set sv_maxRate                 "0"
set sv_maxPing                 "0"
set sv_minPing                 "0"
set snaps                      "40"

//////////////////////
//   Bot Settings   //
//////////////////////
set bot_enable                 "1"
set bot_minplayers             "4"
set g_spskill                  "3"

//////////////////////
//   OSP Settings   //
//////////////////////
set server_promode             "0"
set osp_gamename               "0"

//////////////////////
//   Map Rotation   //
//////////////////////
set d1 "map q3dm7;  set nextmap vstr d2"
set d2 "map q3dm17; set nextmap vstr d3"
set d3 "map q3tourney2; set nextmap vstr d4"
set d4 "map q3dm6;  set nextmap vstr d5"
set d5 "map q3dm11; set nextmap vstr d6"
set d6 "map q3dm13; set nextmap vstr d7"
set d7 "map q3dm12; set nextmap vstr d8"
set d8 "map q3tourney4; set nextmap vstr d9"
set d9 "map q3dm4;  set nextmap vstr d10"
set d10 "map q3dm1; set nextmap vstr d1"

//////////////////////
//  Logging         //
//////////////////////
set g_log                      "games.log"
set g_logSync                  "1"

//////////////////////
//   Voting         //
//////////////////////
set g_allowvote                "1"

// Start the server
vstr d2
