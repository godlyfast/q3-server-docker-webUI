/////////////////////////////////////////////
//   CENDAS Q3 Server Configuration       //
//   Mod: Excessive Plus v2.3 (FreezeTag) //
/////////////////////////////////////////////

//////////////////////
// E+ Settings      //
//////////////////////
// g_gametype 8 = FreezeTag (team-based freeze/thaw)
// xp_unlagged 1 = lag compensation (critical for hit detection)
// xp_config "" = use E+ built-in defaults (300HP regen, multi-jump, overpowered weapons)
set g_gametype                    "8"
set xp_unlagged                   "1"
set xp_config                     ""

//////////////////////
// Gameplay Options //
//////////////////////
set fraglimit                     "0"
set timelimit                     "10"
set capturelimit                  "8"
set g_forceRespawn                "0"
set g_warmup                      "15"
set g_dowarmup                    "1"
set g_teamautojoin                "1"
set g_teamforcebalance            "1"

//////////////////////
//  Server Options  //
//////////////////////
set sv_hostname                   "CENDAS Q3 Excessive+"
set sv_maxclients                 "16"
set sv_pure                       "0"
set sv_allowDownload              "1"
set sv_dlURL                      "http://dczp.jsninjas.net:41960"
set sv_cheats                     "0"
set sv_floodprotect               "1"
set g_inactivity                  "120"
set g_motd                        "Welcome to CENDAS Excessive+ FreezeTag"
set g_needpass                    "0"

//////////////////////
//  RCON / Admin    //
//////////////////////
set rconPassword                  "__RCON_PASSWORD__"
set sv_privateClients             "0"

//////////////////////
//  Network         //
//////////////////////
set sv_maxRate                    "0"
set sv_maxPing                    "0"
set sv_minPing                    "0"
set snaps                         "40"

//////////////////////
//   Bot Settings   //
//////////////////////
set bot_enable                    "1"
set bot_minplayers                "6"
set g_spskill                     "3"

//////////////////////
//  Logging         //
//////////////////////
set g_log                         "games.log"
set g_logSync                     "1"

//////////////////////
//   Voting         //
//////////////////////
set g_allowvote                   "1"

//////////////////////
//  Map Rotation    //
//////////////////////
set r1   "map q3dm17; set nextmap vstr r2"
set r2   "map q3dm7;  set nextmap vstr r3"
set r3   "map q3dm6;  set nextmap vstr r4"
set r4   "map q3dm12; set nextmap vstr r5"
set r5   "map q3dm4;  set nextmap vstr r6"
set r6   "map q3dm11; set nextmap vstr r7"
set r7   "map q3dm13; set nextmap vstr r8"
set r8   "map q3dm8;  set nextmap vstr r9"
set r9   "map q3dm14; set nextmap vstr r10"
set r10  "map q3dm19; set nextmap vstr r11"
set r11  "map q3dm5;  set nextmap vstr r12"
set r12  "map q3dm3;  set nextmap vstr r1"

// Start rotation
vstr r1
