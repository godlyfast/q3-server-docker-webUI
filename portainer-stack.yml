# Q3 Server Stack - deploy via Portainer at https://192.168.55.100:9443
# Images built and pushed by build.sh
#
# Services:
#   quake3       - ioquake3 dedicated server + CPMA mod (UDP 27960)
#   ng-quake3-be - Node.js REST API + Socket.io RCON bridge (internal 9009)
#   ng-quake3-fe - Angular web UI served by nginx (HTTP 8080)
#   q3-downloads - Static pk3 file server for sv_dlURL (HTTP 41960, internet-safe)
#
# Set RCON_PASSWORD in both services to the same value.
# The game server substitutes it into server.cfg at startup;
# the backend uses it for RCON commands.

services:
  quake3:
    image: 192.168.55.100:5000/q3-server:latest
    container_name: q3-server
    restart: unless-stopped
    environment:
      - RCON_PASSWORD=CHANGEME
    ports:
      - "27960:27960/udp"
    volumes:
      - /home/tim/q3-data/server/baseq3:/home/ioq3srv/ioquake3/baseq3:ro
      - /home/tim/q3-data/server/cpma/cfg-maps:/home/ioq3srv/ioquake3/cpma/cfg-maps:ro
      - q3-shared:/shared
    networks:
      - q3net

  ng-quake3-be:
    image: 192.168.55.100:5000/q3-backend:latest
    container_name: q3-backend
    restart: unless-stopped
    environment:
      - Q3SERV_HOST=quake3
      - Q3SERV_PORT=27960
      - Q3SERV_PASS=CHANGEME
      - HOST=0.0.0.0
      - PORT=9009
    volumes:
      - q3-shared:/shared
    depends_on:
      - quake3
    networks:
      - q3net

  ng-quake3-fe:
    image: 192.168.55.100:5000/q3-frontend:latest
    container_name: q3-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - /home/tim/q3-data/downloads:/usr/share/nginx/html/downloads:ro
    depends_on:
      - ng-quake3-be
    networks:
      - q3net

  q3-downloads:
    image: nginx:1.24-alpine
    container_name: q3-downloads
    restart: unless-stopped
    ports:
      - "41960:41960"
    volumes:
      - /home/tim/q3-data/downloads:/usr/share/nginx/html:ro
      - /home/tim/q3-data/downloads-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - q3net

volumes:
  q3-shared:

networks:
  q3net:
    driver: bridge
