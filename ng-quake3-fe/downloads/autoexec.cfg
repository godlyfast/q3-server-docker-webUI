// ==============================================
// CENDAS Q3 - Client Config
// ==============================================
// Place in: baseq3/autoexec.cfg
// Works with ioquake3 OpenGL2 + quake3e Vulkan
// Both engines safely ignore each other's unknown cvars
//
// Set your name:
//   seta name "YourName"
// ==============================================

// ========================
// MEMORY (required for HD/4K texture packs)
// ========================
// WARNING: com_zoneMegs MUST also be passed on the command line!
// The engine allocates zone memory BEFORE reading config files.
// With 157+ pk3s the default 24 MB causes a Z_Malloc crash on startup.
//
// Launch with: ioquake3 +set com_hunkMegs 1024 +set com_zoneMegs 512
//
// The values below ensure persistence in q3config.cfg for future runs,
// but the command-line flag is always required for the initial allocation.
seta com_hunkMegs "1024"
seta com_zoneMegs "512"

// ========================
// DISPLAY
// ========================
seta r_mode "-2"                           // Native desktop resolution (auto-detect)
seta r_fullscreen "1"                      // Fullscreen

// ========================
// GAMEPLAY
// ========================
seta cg_autoswitch "0"                     // Don't auto-switch weapon on pickup
bind MOUSE2 "+zoom"                        // Right-click to zoom

// ========================
// TEXTURE QUALITY
// ========================
seta r_picmip "0"                          // Maximum texture quality (0=best)
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR" // Trilinear filtering
seta r_ext_texture_filter_anisotropic "16" // Max anisotropic filtering
seta r_ext_compressed_textures "0"         // No texture compression (use full quality)
seta r_simpleMipMaps "0"                   // Higher quality mipmap generation

// ========================
// GEOMETRY & DETAIL
// ========================
seta r_subdivisions "1"                    // Smoothest curved surfaces
seta r_lodBias "-2"                        // Force highest LOD (no model pop-in)
seta cg_brassTime "2500"                   // Shell casings visible longer
seta cg_marks "1"                          // Bullet marks on walls

// ========================
// LIGHTING & SHADOWS
// ========================
seta r_dynamiclight "1"                    // Dynamic lights (rockets, plasma)
seta r_vertexLight "0"                     // Use lightmaps (NOT vertex lighting)
seta r_overBrightBits "1"                  // Proper brightness
seta r_mapOverBrightBits "2"               // Map lighting (2 = standard Q3 look)
seta cg_shadows "1"                        // Enable player shadows

// ========================
// ioquake3 OPENGL2 (ignored by quake3e)
// ========================
// HDR pipeline
seta r_hdr "1"                             // HDR rendering
seta r_postProcess "1"                     // Post-processing pipeline
seta r_toneMap "0"                         // OFF: preserves original Q3 vivid contrast
seta r_autoExposure "0"                    // OFF: prevents washed-out brightness shifts

// Materials
seta r_normalMapping "2"                   // Oren-Nayar diffuse (uses real _n maps from HD packs)
seta r_specularMapping "1"                 // Uses real specular maps when provided
seta r_genNormalMaps "0"                   // OFF: don't auto-generate fake bumps from diffuse
seta r_deluxeMapping "1"                   // Uses actual map lightmap data
seta r_cubeMapping "1"                     // Cubemap reflections on metal/shiny
seta r_ssao "1"                            // Screen-space ambient occlusion (depth)

// Sun & Shadows
seta r_drawSunRays "1"                     // Volumetric god rays
seta r_sunlightMode "1"                    // 1=multiply (natural)
seta r_sunShadows "1"                      // Cascaded shadow maps
seta r_shadowFilter "2"                    // Soft shadows
seta r_shadowBlur "1"                      // Shadow edge softening
seta r_shadowMapSize "2048"                // High-res shadow maps
seta r_depthPrepass "1"                    // Required for shadows

// Anti-aliasing
seta r_ext_framebuffer_multisample "4"     // 4x MSAA (OpenGL2 FBO-based)

// ========================
// quake3e VULKAN (ignored by ioquake3)
// ========================
seta r_fbo "1"                             // Required for bloom/MSAA in quake3e
seta r_hdr "1"                             // 16-bit framebuffer, no banding
seta r_bloom "1"                           // Light bloom post-process
seta r_bloom_passes "5"                    // Blur passes
seta r_bloom_threshold "0.6"               // Brightness cutoff for bloom
seta r_bloom_intensity "0.5"               // Bloom blend strength
seta r_bloom_filter_size "8"               // Wider Gaussian blur for richer glow
seta r_dlightMode "2"                      // Per-pixel dynamic lights on all models
seta r_ext_multisample "8"                 // 8x MSAA

// ========================
// SKY & EFFECTS
// ========================
seta r_fastsky "0"                         // Render sky fully
seta cg_gibs "1"                           // Show gibs
seta cg_simpleItems "0"                    // Full 3D item models (not sprites)

// ========================
// PERFORMANCE
// ========================
seta com_maxfps "250"                      // Uncap FPS (Q3 physics tied to 125/250/333)
seta r_finish "0"                          // Don't sync GPU (reduces input lag)
seta r_swapInterval "0"                    // VSync off
seta r_smp "1"                             // Multi-threaded renderer

// ========================
// NETWORK
// ========================
seta rate "25000"                          // Network rate
seta snaps "40"                            // Snapshot rate
seta cl_maxpackets "125"                   // Packet rate

// ========================
// INPUT
// ========================
seta cl_mouseAccel "0"                     // Disable mouse acceleration (raw input)
seta m_filter "0"                          // No mouse smoothing

// ========================
// HUD
// ========================
seta cg_drawFPS "1"                        // Show FPS counter
seta cg_drawTimer "1"                      // Show match timer
seta cg_draw2D "1"                         // Show HUD

echo "^2CENDAS Q3 config loaded"
