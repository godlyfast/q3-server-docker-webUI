// ==============================================
// CENDAS Q3 - Maximum Graphics Quality Config
// ==============================================
// Place in: baseq3/autoexec.cfg
// Works with ioquake3 + HD texture packs
// ==============================================

// ========================
// RENDERER (OpenGL2 = best)
// ========================
// OpenGL2 adds: HDR, bloom, tone mapping, dynamic shadows, normal maps
seta cl_renderer "opengl2"

// ========================
// RESOLUTION & DISPLAY
// ========================
seta r_mode "-1"                           // Custom resolution (use r_customwidth/height)
seta r_customwidth "2560"                  // Set to your monitor width
seta r_customheight "1440"                 // Set to your monitor height
seta r_fullscreen "1"                      // Fullscreen
seta r_allowResize "0"
seta r_colorbits "32"                      // 32-bit color
seta r_depthbits "24"                      // 24-bit depth buffer
seta r_stencilbits "8"                     // Stencil buffer (needed for shadows)
seta r_texturebits "32"                    // 32-bit textures

// ========================
// TEXTURE QUALITY
// ========================
seta r_picmip "0"                          // Maximum texture quality (0=best)
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR" // Trilinear filtering
seta r_ext_texture_filter_anisotropic "16" // Max anisotropic filtering
seta r_ext_max_anisotropy "16"             // Max aniso level
seta r_ext_compressed_textures "0"         // No texture compression (use full quality)

// ========================
// GEOMETRY & DETAIL
// ========================
seta r_subdivisions "1"                    // Smoothest curved surfaces
seta r_lodbias "0"                         // Full model detail
seta r_lodCurveError "10000"               // Never reduce curve detail
seta cg_brassTime "2500"                   // Shell casings visible longer
seta cg_marks "1"                          // Bullet marks on walls

// ========================
// LIGHTING & SHADOWS
// ========================
seta r_dynamiclight "1"                    // Dynamic lights (rockets, plasma)
seta r_vertexLight "0"                     // Use lightmaps (NOT vertex lighting)
seta r_overBrightBits "1"                  // Proper brightness
seta r_mapOverBrightBits "2"               // Map lighting (2 = standard Q3 look)
seta r_intensity "1.0"                     // Texture brightness multiplier
seta r_gamma "1.0"                         // Gamma (adjust to taste, 1.0-1.4)
seta cg_shadows "1"                        // Enable player shadows

// === OpenGL2 Specific (ignored by opengl1) ===
seta r_hdr "1"                             // HDR rendering
seta r_postProcess "1"                     // Post-processing (bloom, tone mapping)
seta r_toneMap "1"                         // HDR tone mapping
seta r_autoExposure "1"                    // Auto exposure adjustment
seta r_normalMapping "1"                   // Normal mapping on surfaces
seta r_specularMapping "1"                 // Specular highlights
seta r_deluxeMapping "1"                   // Deluxe light mapping
seta r_parallaxMapping "0"                 // Parallax mapping (expensive, optional)
seta r_cubeMapping "1"                     // Cubemap reflections
seta r_sunlightMode "2"                    // Cascaded shadow maps (0=off, 1=basic, 2=best)
seta r_sunShadows "1"                      // Sun casts shadows
seta r_shadowFilter "2"                    // Shadow filter quality (0-2, 2=best)
seta r_shadowBlur "1"                      // Smooth shadow edges
seta r_forceSun "0"                        // Use map's sun settings
seta r_drawSunRays "1"                     // Volumetric sun rays (god rays)
seta r_ssao "1"                            // Screen Space Ambient Occlusion (opengl2 fork)

// ========================
// SKY & EFFECTS
// ========================
seta r_fastsky "0"                         // Render sky fully
seta cg_gibs "1"                           // Show gibs
seta cg_blood "1"                          // Show blood effects
seta cg_simpleItems "0"                    // Full 3D item models (not sprites)

// ========================
// PERFORMANCE
// ========================
seta com_maxfps "250"                      // Uncap FPS (Q3 physics tied to 125/250/333)
seta r_finish "0"                          // Don't sync GPU (reduces input lag)
seta r_swapInterval "0"                    // VSync off (use compositor sync instead)
seta r_smp "1"                             // Multi-threaded renderer
seta r_displayRefresh "0"                  // Auto-detect refresh rate
seta cl_maxpackets "125"                   // Network packet rate
seta rate "25000"                          // Network rate
seta snaps "40"                            // Snapshot rate (match server)

// ========================
// HUD & CROSSHAIR
// ========================
seta cg_drawFPS "1"                        // Show FPS counter
seta cg_lagometer "0"                      // Hide lagometer (enable if debugging)
seta cg_drawTimer "1"                      // Show match timer
seta cg_crosshairSize "24"                 // Crosshair size
seta cg_draw2D "1"                         // Show HUD

// ========================
// SOUND
// ========================
seta s_sdlSpeed "44100"                    // 44.1 kHz audio
seta s_volume "0.7"                        // Master volume
seta s_musicvolume "0.25"                  // Music volume
seta s_doppler "1"                         // Doppler effect on sounds

// ========================
// NETWORK / SERVER
// ========================
seta cg_optimizePrediction "1"             // Smoother prediction
seta cl_mouseAccel "0"                     // Disable mouse acceleration (raw input)
seta sensitivity "3"                       // Mouse sensitivity (adjust to taste)
seta m_filter "0"                          // No mouse smoothing

// Connect to CENDAS server
// /connect 192.168.55.100

echo "^2CENDAS Q3 config loaded - OpenGL2 max quality"
