// CENDAS Q3 Client - Max Quality Config
// ioquake3 OpenGL2 + quake3e Vulkan
// Both engines safely ignore each other's unknown cvars

// ==============================
// UNIVERSAL (both engines)
// ==============================

// Memory (required for HD/4K texture packs)
seta com_hunkMegs "1024"
seta com_zoneMegs "512"

// Gameplay
seta cg_autoswitch "0"
bind MOUSE2 "+zoom"

// Resolution & Display
seta r_mode "-2"                            // Native desktop resolution (auto-detect)
seta r_fullscreen "1"
seta com_maxfps "240"

// Texture Quality - Maximum
seta r_picmip "0"
seta r_detailtextures "1"
seta r_ext_multitexture "1"
seta r_ext_texture_env_add "1"
seta r_ext_compressed_textures "0"
seta r_textureMode "GL_LINEAR_MIPMAP_LINEAR"
seta r_ext_texture_filter_anisotropic "16"
seta r_simpleMipMaps "0"

// Geometry & Models
seta r_subdivisions "4"
seta r_lodBias "-2"                         // Force highest LOD always (no model pop-in)
seta cg_brassTime "2500"
seta cg_marks "1"

// Lighting & Effects
seta r_dynamiclight "1"
seta r_fastSky "0"
seta r_drawSun "1"
seta r_flares "1"
seta cg_shadows "1"
seta r_vertexLight "0"
seta r_overBrightBits "1"
seta r_mapOverBrightBits "2"

// Color Depth
seta r_stencilBits "8"
seta r_depthBits "24"
seta r_colorBits "32"
seta r_textureBits "32"

// Network
seta rate "25000"
seta snaps "40"
seta cl_maxpackets "125"
seta cl_packetdup "1"

// Input
seta cl_mouseAccel "0"
seta m_filter "0"

// FOV (wider for 16:10)
seta cg_fov "110"

// HUD
seta cg_drawFPS "1"
seta cg_lagometer "1"

// ==============================
// ioquake3 OpenGL2 (ignored by quake3e)
// ==============================

// HDR pipeline (keep HDR precision, disable tone mapping for vivid colors)
seta r_hdr "1"
seta r_postProcess "1"
seta r_toneMap "0"                          // OFF: preserves original Q3 vivid contrast
seta r_autoExposure "0"                     // OFF: prevents washed-out brightness shifts

// Materials (use real normal/specular maps from HD packs, don't auto-generate fakes)
seta r_normalMapping "2"                    // Oren-Nayar diffuse model (better light scattering)
seta r_specularMapping "1"                  // Use specular maps when pk3 provides them
seta r_genNormalMaps "0"                    // OFF: don't auto-generate fake bumps from diffuse
seta r_deluxeMapping "1"                    // Uses actual map lightmap direction data
seta r_cubeMapping "1"                      // Cubemap reflections on metal/shiny surfaces
seta r_pbr "0"                              // PBR mode experimental, leave off

// Ambient Occlusion
seta r_ssao "1"                             // Screen-space AO (adds depth to corners/crevices)

// Sun & Shadows (only on maps with q3gl2_sun shader)
seta r_drawSunRays "1"                      // Volumetric god rays on outdoor maps
seta r_sunlightMode "1"                     // 1=multiply (natural), 2=additive (brighter)
seta r_sunShadows "1"                       // Cascaded shadow maps from sunlight
seta r_shadowFilter "2"                     // Soft shadows (0=hard, 1=light, 2=heavy)
seta r_shadowBlur "1"                       // Additional shadow edge softening
seta r_shadowMapSize "2048"                 // High-res shadow maps (1024=normal, 2048=crisp)
seta r_depthPrepass "1"                     // Required for sun shadows

// Anti-aliasing (OpenGL2 MSAA)
seta r_ext_framebuffer_multisample "4"      // 4x MSAA via FBO

// ==============================
// quake3e Vulkan (ignored by ioquake3)
// ==============================

// Framebuffer & HDR
seta r_fbo "1"                              // Required for bloom, MSAA, HDR in quake3e
seta r_hdr "1"                              // 16-bit framebuffer, no color banding

// Bloom
seta r_bloom "1"                            // Light bloom post-process
seta r_bloom_passes "5"                     // Blur passes (default, well-balanced)
seta r_bloom_threshold "0.6"                // Brightness cutoff for bloom extraction
seta r_bloom_intensity "0.5"                // Bloom blend strength
seta r_bloom_filter_size "8"                // Gaussian blur width (6=default, 8=richer glow)

// Dynamic Lighting
seta r_dlightMode "2"                       // Per-pixel dynamic lights on ALL models (best quality)

// Anti-aliasing
seta r_ext_multisample "8"                  // 8x MSAA (quake3e cvar, separate from ioquake3's)

// ==============================
// CPMA Server Browser (ignored by baseq3)
// ==============================
seta sv_master1 "master.quake3arena.com"
seta sv_master2 "master.ioquake3.org"
seta ui_browserMaster "1"
seta ui_browserGameType "0"
seta ui_browserShowEmpty "1"
seta ui_browserShowFull "1"
