
<div class="container" *ngIf="serverMode">
  <mat-card class="mode-card">
    <mat-card-content>
      <div class="mode-row">
        <span class="mode-label">Server Mode: <strong>{{modeLabel}}</strong></span>
        <div class="mode-buttons">
          <button *ngFor="let mode of modes"
                  mat-raised-button
                  [color]="mode.value === serverMode ? 'accent' : 'primary'"
                  (click)="switchTo(mode)"
                  [disabled]="modeLoading || mode.value === serverMode">
            {{mode.label}}
          </button>
        </div>
      </div>
      <span *ngIf="modeLoading" class="restarting">Server restarting...</span>
    </mat-card-content>
  </mat-card>

  <mat-card class="mode-card">
    <mat-card-content>
      <div class="mode-row">
        <span class="mode-label">Gametype: <strong>{{currentGametypeLabel}}</strong></span>
        <div class="mode-buttons">
          <button *ngFor="let gt of availableGametypes"
                  mat-raised-button
                  [color]="gt.value === currentGametype ? 'accent' : 'primary'"
                  (click)="switchGametype(gt)"
                  [disabled]="gt.value === currentGametype"
                  [matTooltip]="gt.desc">
            {{gt.label}}
          </button>
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</div>

<div *ngIf="rconData">
  <div class="container">
    <div class="home-map-name" style="padding-bottom: 30px">
      <h2>Playing <strong>{{rconData.currentMap}}</strong></h2>
    </div>

    <table class="table table-dark">
      <thead>
      <tr>
        <th>Name</th>
<!--    <th>cl</th>-->
        <th>Ping</th>
        <th>Score</th>
        <th>Rate</th>
<!--     <th>address</th>-->
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let player of rconData.players">
        <td appQ3name="{{player.name}}"></td>
<!--    <td>{{player.cl}}</td>-->
        <td>{{player.ping}}</td>
        <td>{{player.score}}</td>
        <td>{{player.rate >= 99999 ? '---' : player.rate}}</td>
<!--    <td appQ3name="{{player.address}}"></td> -->
      </tr>
      </tbody>
    </table>
  </div>
</div>
