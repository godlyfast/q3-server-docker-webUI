/////////////////////////////////////////////
//   CENDAS Q3 Server Configuration       //
//   Mode: OSP 1.03a (FFA)               //
/////////////////////////////////////////////

//////////////////////
// Gameplay Options //
//////////////////////
set g_gametype                    "0"
set fraglimit                     "30"
set timelimit                     "15"
set capturelimit                  "8"
set g_forceRespawn                "10"
set g_warmup                      "15"
set g_dowarmup                    "0"
set g_teamautojoin                "0"
set g_teamforcebalance            "1"

//////////////////////
//  Server Options  //
//////////////////////
set sv_hostname                   "CENDAS Q3 OSP"
set sv_maxclients                 "16"
set sv_pure                       "0"
set sv_allowDownload              "1"
set sv_dlURL                      "http://dczp.jsninjas.net:41960"
set sv_cheats                     "0"
set sv_floodprotect               "1"
set g_inactivity                  "120"
set g_motd                        "Welcome to CENDAS Q3 OSP"
set g_needpass                    "0"

//////////////////////
//  RCON / Admin    //
//////////////////////
set rconPassword                  "__RCON_PASSWORD__"
set sv_privateClients             "0"

//////////////////////
//  OSP Settings    //
//////////////////////
set capfps                        "0"

//////////////////////
//  Network         //
//////////////////////
set sv_maxRate                    "0"
set sv_maxPing                    "0"
set sv_minPing                    "0"
set snaps                         "40"

//////////////////////
//   Bot Settings   //
//////////////////////
set bot_enable                    "1"
set bot_minplayers                "4"
set g_spskill                     "3"

//////////////////////
//  Logging         //
//////////////////////
set g_log                         "games.log"
set g_logSync                     "1"

//////////////////////
//   Voting         //
//////////////////////
set g_allowvote                   "1"

//////////////////////
