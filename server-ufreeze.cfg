/////////////////////////////////////////////
//   CENDAS Q3 Server Configuration       //
//   Mode: Ultra Freeze Tag 1.1 (TDM)    //
/////////////////////////////////////////////

//////////////////////
// Gameplay Options //
//////////////////////
// UFreeze uses g_gametype 3 (TDM) — FreezeTag logic runs within TDM framework
set g_gametype                    "3"
set fraglimit                     "0"
set timelimit                     "15"
set capturelimit                  "8"
set g_forceRespawn                "10"
set g_warmup                      "15"
set g_dowarmup                    "0"
set g_teamautojoin                "1"
set g_teamforcebalance            "1"
set g_friendlyFire                "0"

//////////////////////
// UFreeze Settings //
//////////////////////
set g_thawTime                    "3.0"
set g_autoThawTime                "120"
set g_noFreezeTime                "2.0"
set g_doSuddenDeath               "1"
set g_startArmor                  "5"
set dmflags                       "0"
// Spawn weapons: Shotgun(2) + Grenade(4) + Rocket(8) = 14
set wpflags                       "14"
// Disable BFG (128)
set weaponlimit                   "128"

//////////////////////
//  Server Options  //
//////////////////////
set sv_hostname                   "CENDAS Q3 UFreeze"
set sv_maxclients                 "16"
set sv_pure                       "0"
set sv_allowDownload              "1"
set sv_dlURL                      "http://dczp.jsninjas.net:41960"
set sv_cheats                     "0"
set sv_floodprotect               "0"
set g_floodProtect                "1"
set g_smoothClients               "1"
set g_inactivity                  "120"
set g_motd                        "Welcome to CENDAS Ultra Freeze Tag - Freeze em all!"
set g_needpass                    "0"

//////////////////////
//  RCON / Admin    //
//////////////////////
set rconPassword                  "__RCON_PASSWORD__"
set sv_privateClients             "0"

//////////////////////
//  Network         //
//////////////////////
set sv_maxRate                    "0"
set sv_maxPing                    "0"
set sv_minPing                    "0"
set snaps                         "40"

//////////////////////
//   Bot Settings   //
//////////////////////
set bot_enable                    "1"
set bot_minplayers                "3"
set bot_nochat                    "0"
set g_spskill                     "3"

//////////////////////
//  Logging         //
//////////////////////
set g_log                         "games.log"
set g_logSync                     "1"

//////////////////////
//   Voting         //
//////////////////////
set g_allowvote                   "1"

//////////////////////
//  Map Rotation    //
//////////////////////
// Team-friendly maps good for FreezeTag
set r1   "map q3dm7; set nextmap vstr r2"
set r2   "map q3dm6; set nextmap vstr r3"
set r3   "map q3dm8; set nextmap vstr r4"
set r4   "map q3dm9; set nextmap vstr r5"
set r5   "map q3dm11; set nextmap vstr r6"
set r6   "map q3dm12; set nextmap vstr r7"
set r7   "map q3dm14; set nextmap vstr r8"
set r8   "map q3dm15; set nextmap vstr r9"
set r9   "map q3dm17; set nextmap vstr r10"
set r10  "map q3tourney4; set nextmap vstr r11"
set r11  "map q3dm4; set nextmap vstr r12"
set r12  "map q3dm13; set nextmap vstr r1"

// Start rotation
vstr r1
